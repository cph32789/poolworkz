<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — Poolworkz</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="wf-banner">Wireframe preview — only page navigation works, nothing else is functional.</div>
<div style="min-height:100vh;display:flex;flex-direction:column;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:var(--space-5) var(--space-8);border-bottom:2px solid var(--color-divider);">
    <a href="index.html" style="font-family:var(--font-heading);font-weight:700;letter-spacing:0.02em;font-size:20px;color:inherit;text-decoration:none;">POOLWORKZ</a>
    <a href="shop.html" class="btn btn-ghost">Log in</a>
  </div>

  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:var(--space-8) var(--space-4);">
    <div style="max-width:460px;width:100%;">
      <div style="border-top:2px solid var(--color-divider);padding-top:var(--space-5);">
        <h1 style="font-family:var(--font-heading);font-size:40px;font-weight:700;line-height:1.05;margin:0 0 var(--space-3);">Pool care, delivered.</h1>
        <p style="font-size:16px;opacity:0.75;margin:0 0 var(--space-6);max-width:40ch;">Chlorine, acid, shock and more — dropped at your door before you run out. Enter your zip to see if we deliver to you.</p>
        <div class="field"><label for="zip-input">ZIP code</label>
          <input class="input" id="zip-input" inputmode="numeric" maxlength="5" placeholder="e.g. 30301" value="30301"></div>
        <a href="shop.html" class="btn btn-primary btn-block" style="margin-top:var(--space-4);">Check availability
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
        </a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
