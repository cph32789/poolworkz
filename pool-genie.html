<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool Genie — Poolworkz</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="wf-banner">Wireframe preview — only page navigation works, nothing else is functional.</div>
<div style="min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);">
  <nav class="nav" style="padding:0 var(--space-8);">
    <a href="index.html" class="nav-brand" style="text-decoration:none;font-weight:700;letter-spacing:0.02em;color:inherit;">POOLWORKZ</a>
    <a href="shop.html">Shop</a>
    <a href="profile.html">Profile</a>
    <a href="test-results.html">Test Results</a>
    <a href="pool-genie.html" aria-current="page">Pool Genie</a>
    <a href="blog.html">Blog</a>
    <a href="shop.html#cart" class="btn btn-ghost btn-icon" aria-label="Cart" style="position:relative;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path></svg>
    </a>
  </nav>

  <div style="max-width:680px;margin:0 auto;padding:var(--space-8) var(--space-6);">
    <div style="border-top:2px solid var(--color-divider);padding-top:var(--space-5);margin-bottom:var(--space-6);">
      <h1 style="font-family:var(--font-heading);font-size:36px;font-weight:700;margin:0 0 var(--space-2);">Pool Genie</h1>
      <p style="font-size:15px;opacity:0.7;margin:0;">Tell the Genie what's happening and get a straight answer on what to do.</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:var(--space-3);margin-bottom:var(--space-5);">
      <div style="display:flex;justify-content:flex-start;">
        <div style="max-width:80%;padding:var(--space-3) var(--space-4);background:var(--color-neutral-100);color:var(--color-text);border:2px solid var(--color-divider);">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;opacity:0.6;margin-bottom:4px;">Pool Genie</div>
          <div style="font-size:14px;line-height:1.5;">What's going on with your pool?</div>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:var(--space-2);">
      <button type="button" class="btn btn-secondary">Cloudy or hazy water</button>
      <button type="button" class="btn btn-secondary">Green water or visible algae</button>
      <button type="button" class="btn btn-secondary">Strong chlorine smell / stinging eyes</button>
      <button type="button" class="btn btn-secondary">Chlorine reading is low or zero</button>
    </div>
  </div>
</div>
</body>
</html>
